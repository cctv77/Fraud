name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Code (设备代号)'
        required: true
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU)'
        required: true
        type: boolean
        default: false
      target_os:
        description: 'Target OS (目标系统)'
        required: true
        type: choice
        default: 'miui'
        options:
          - aosp
          - miui
jobs:
  build-kernel:
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Export GIT short hash
      run: echo "BUILD_HASH=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-
    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz
    - id: build
      name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        ARGS="${{ github.event.inputs.device }}"
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        echo "Executing command: ./build_kernel.sh $ARGS"
        ./build_kernel.sh $ARGS
        ZIP_FILE=$(ls *.zip)
        echo "zip_path=${ZIP_FILE}" >> $GITHUB_OUTPUT
    - name: Print final kernel version
      id: print_version
      if: always()
      run: |
        set -euo pipefail
        echo "Searching for kernel image..."
        # look for common kernel image names (adjust maxdepth if your build places them deeper)
        FILE=$(find . -maxdepth 6 -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'zImage' -o -name 'vmlinuz' -o -name 'bzImage' -o -name '*.img' \) | head -n1 || true)
        if [ -z "$FILE" ]; then
          FILE=$(find . -maxdepth 6 -type f -name 'System.map' | head -n1 || true)
        fi
        if [ -z "$FILE" ]; then
          echo "No kernel image nor System.map found to extract version."
          echo "kernel_version=unknown" >> $GITHUB_OUTPUT || true
          exit 0
        fi
        echo "Found candidate: $FILE"
        if echo "$FILE" | grep -qE '\.gz$'; then
          STRINGS_CMD="gunzip -c \"$FILE\" | strings"
        else
          STRINGS_CMD="strings \"$FILE\""
        fi
        VER=$(/bin/sh -c "$STRINGS_CMD" | grep -a -m1 -E 'Linux version [0-9]+\.[0-9]+(\.[0-9]+)?' || true)
        if [ -z "$VER" ]; then
          VER=$(strings "$FILE" | grep -a -m1 -E 'Kernel command line|Linux version' || true)
        fi
        if [ -n "$VER" ]; then
          echo "kernel_version=$VER" >> $GITHUB_OUTPUT
          echo "Final kernel version: $VER"
        else
          echo "Could not detect kernel version from $FILE"
          echo "kernel_version=unknown" >> $GITHUB_OUTPUT
    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: kernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: "*.zip"
        compression-level: 0
    - name: Upload to Telegram
      if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        ZIP_PATH="${{ steps.build.outputs.zip_path }}"
        SIZE=$(stat -c%s "$ZIP_PATH")
        SIZE_MB=$((SIZE/1024/1024))
        SHA256=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
        MSG="📦 Kernel Build
        📱 \`${{ github.event.inputs.device }}\`
        🐧 \`${{ github.event.inputs.target_os }}\`
        🔧 \`${{ github.event.inputs.ksu }}\`
        📄 \`${ZIP_PATH}\`
        📏 \`${SIZE_MB}M\`
        🔒 \`${SHA256:0:12}...\`"
        curl -s -F chat_id=${{ env.TELEGRAM_CHAT_ID }} -F document=@$ZIP_PATH -F caption="$MSG" -F parse_mode=Markdown https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendDocument
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
