name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build Mode'
        required: true
        default: 'single'
        type: choice
        options:
          - single
          - all_miui
          - all_aosp
      device:
        description: 'Target Device Code (only for single mode)'
        required: false
        default: 'alioth'
        type: choice
        options:
          - alioth
          - apollo
          - cas
          - cmi
          - dagu
          - elish
          - enuma
          - lmi
          - munch
          - pipa
          - psyche
          - thyme
          - umi
      ksu:
        description: 'Enable KernelSU (ReSukiSU) (only for single mode)'
        required: false
        type: boolean
        default: false
      target_os:
        description: 'Target OS (only for single mode)'
        required: false
        type: choice
        default: 'miui'
        options:
          - miui
          - aosp
jobs:
  build-single:
    if: github.event.inputs.build_mode == 'single'
    name: Build ${{ github.event.inputs.device }} | KSU:${{ github.event.inputs.ksu }} | OS:${{ github.event.inputs.target_os }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Export GIT short hash
      run: echo "BUILD_HASH=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
    - name: Debug config binary
      run: |
        echo "PWD=$(pwd)"
        echo "PATH=$PATH"
        which config || true
        command -v config || true
        config --version 2>/dev/null || true
        ls -l ./scripts/config || true
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ github.event.inputs.device }}-
          ${{ runner.os }}-kernel-ccache-
    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz
    - id: build
      name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        ARGS="${{ github.event.inputs.device }}"
        if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
          ARGS="$ARGS ksu"
        fi
        ARGS="$ARGS ${{ github.event.inputs.target_os }}"
        ./build_kernel.sh $ARGS
        echo "zip_path=$(ls *.zip)" >> $GITHUB_OUTPUT
    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: kernel-${{ github.event.inputs.device }}-${{ github.event.inputs.target_os }}-${{ github.run_id }}
        path: "*.zip"
        compression-level: 0
    - name: Upload to Telegram
      if: success() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        ZIP_PATH="${{ steps.build.outputs.zip_path }}"
        SIZE=$(stat -c%s "$ZIP_PATH")
        SIZE_MB=$((SIZE/1024/1024))
        SHA256=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
        MSG="📦 Kernel Build
        📱 \`${{ github.event.inputs.device }}\`
        🐧 \`${{ github.event.inputs.target_os }}\`
        🔧 \`${{ github.event.inputs.ksu }}\`
        📄 \`${ZIP_PATH}\`
        📏 \`${SIZE_MB}M\`
        🔒 \`${SHA256:0:12}...\`"
        curl -s -F chat_id=${{ env.TELEGRAM_CHAT_ID }} -F document=@$ZIP_PATH -F caption="$MSG" -F parse_mode=Markdown https://api.telegram.org/bot${{ env.TELEGRAM_BOT_TOKEN }}/sendDocument
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: "*.zip"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-all-miui:
    if: github.event.inputs.build_mode == 'all_miui'
    strategy:
      fail-fast: false
      matrix:
        device: [alioth, apollo, cas, cmi, dagu, elish, enuma, lmi, munch, pipa, psyche, thyme, umi]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Export GIT short hash
      run: echo "BUILD_HASH=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ matrix.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ matrix.device }}-
          ${{ runner.os }}-kernel-ccache-
    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz
    - id: build
      name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        ./build_kernel.sh ${{ matrix.device }} miui
        echo "zip_path=$(ls *.zip)" >> $GITHUB_OUTPUT
    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: kernel-${{ matrix.device }}-miui-${{ github.run_id }}
        path: "*.zip"
        compression-level: 0
  release-all-miui:
    if: github.event.inputs.build_mode == 'all_miui'
    needs: build-all-miui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./
        merge-multiple: true
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: miui-kernels-${{ github.run_number }}
        name: MIUI Kernels (${{ github.run_number }})
        files: "*.zip"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-all-aosp:
    if: github.event.inputs.build_mode == 'all_aosp'
    strategy:
      fail-fast: false
      matrix:
        device: [alioth, apollo, cas, cmi, dagu, elish, enuma, lmi, munch, pipa, psyche, thyme, umi]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1
    - name: Export GIT short hash
      run: echo "BUILD_HASH=$(git rev-parse --short=12 HEAD)" >> $GITHUB_ENV
    - name: Set up Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
          git gnupg gperf imagemagick libncurses-dev \
          lib32readline-dev lib32z1-dev liblz4-tool \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
          schedtool squashfs-tools xsltproc zip zlib1g-dev python3
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache_mikernel
        key: ${{ runner.os }}-kernel-ccache-${{ matrix.device }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-kernel-ccache-${{ matrix.device }}-
          ${{ runner.os }}-kernel-ccache-
    - name: Setup zyc-clang 16 Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260510-release/Clang-16.0.6-20260510.tar.gz
        tar -zxvf Clang-16.0.6-20260510.tar.gz
    - id: build
      name: Run Build Script
      run: |
        chmod +x build_kernel.sh
        ./build_kernel.sh ${{ matrix.device }} aosp
        echo "zip_path=$(ls *.zip)" >> $GITHUB_OUTPUT
    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        name: kernel-${{ matrix.device }}-aosp-${{ github.run_id }}
        path: "*.zip"
        compression-level: 0
  release-all-aosp:
    if: github.event.inputs.build_mode == 'all_aosp'
    needs: build-all-aosp
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./
        merge-multiple: true
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: aosp-kernels-${{ github.run_number }}
        name: AOSP Kernels (${{ github.run_number }})
        files: "*.zip"
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
