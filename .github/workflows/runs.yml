name: Cleanup old workflow runs and caches

on:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 UTC 03:00（北京时间 11:00）
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-runs-caches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install gh CLI
        run: |
          type gh >/dev/null 1>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update && sudo apt install -y gh
          }

      - name: Delete old runs, keep latest 1 per workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/workflows" \
            | jq -c '.workflows[] | {id, name}' > wf.jsonl

          ok=0; fail=0
          while IFS= read -r wf; do
            wf_id=$(echo "$wf" | jq -r '.id')
            wf_name=$(echo "$wf" | jq -r '.name')
            echo "=== $wf_name (id=$wf_id) ==="

            gh api "repos/$REPO/actions/workflows/$wf_id/runs?per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[1:] | .[].id' > r.txt

            [ -s r.txt ] || { echo "  ✅ 不超过1条，跳过"; continue; }
            echo "  🗑️ 待删 $(wc -l < r.txt | tr -d ' ') 条"

            while read -r run_id; do
              [ -z "$run_id" ] && continue
              if gh api -X DELETE "repos/$REPO/actions/runs/$run_id" >/dev/null 2>&1; then
                ok=$((ok+1))
              else
                fail=$((fail+1)); echo "  ❌ run $run_id 删除失败"
              fi
            done < r.txt
          done < wf.jsonl

          echo "🎉 runs 清理完成：成功 $ok / 失败 $fail"

      - name: Delete all caches, keep only newest 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "=== 清理前 ==="
          gh api "repos/$REPO/actions/cache/usage" \
            --jq '"缓存数 \(.active_caches_count) / 占用 \(.active_caches_size_in_bytes/1048576|floor) MB"'

          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            | jq -c '.actions_caches[]' > caches.jsonl

          total=$(jq -s 'length' caches.jsonl)
          echo "共 $total 条缓存"
          [ "$total" -le 1 ] && { echo "不超过 1 条，无需清理"; exit 0; }

          echo "保留: $(jq -s -r 'sort_by(.last_accessed_at // .created_at // "") | reverse | .[0] | "\(.key)  (\(.size_in_bytes/1048576|floor) MB)"' caches.jsonl)"

          jq -s -r '
            sort_by(.last_accessed_at // .created_at // "")
            | reverse
            | .[1:][]
            | "\(.id)\t\(.key)\t\((.size_in_bytes/1048576*10|round/10))MB"
          ' caches.jsonl > to_delete.tsv

          echo "待删除 $(wc -l < to_delete.tsv | tr -d ' ') 条"

          ok=0; fail=0
          while IFS=$'\t' read -r id key size; do
            [ -z "${id:-}" ] && continue
            out=$(gh api -X DELETE "repos/$REPO/actions/caches/$id" -i 2>&1 || true)
            case "$(printf '%s' "$out" | head -n1)" in
              *204*|*200*) echo "  ✅ $id  $key  $size"; ok=$((ok+1)) ;;
              *400*) echo "  ⏭ $id  $key  被运行中 job 占用，下轮再删" ;;
              *404*) echo "  ⚠️ $id  已不存在" ;;
              *)     echo "  ❌ $id  $key → $(printf '%s' "$out" | head -n1)"; fail=$((fail+1)) ;;
            esac
          done < to_delete.tsv

          echo "🎉 caches 清理完成：已删 $ok 条，失败 $fail 条"
          echo "（usage 数字约 5 分钟后刷新；gh cache list 可立即查看）"
