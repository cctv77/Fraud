name: Cleanup old workflow runs

on:
  schedule:
    - cron: '0 3 1 * *'   # 每月1号 UTC 03:00 执行
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install gh CLI
        run: |
          type gh >/dev/null 1>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update && sudo apt install -y gh
          }

      - name: Delete old runs, keep latest 1 per workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # 获取所有 workflow 的 ID 和名称
          workflows=$(gh api repos/$REPO/actions/workflows --jq '.workflows[] | {id, name}')

          echo "$workflows" | jq -c '.' | while read -r wf; do
            wf_id=$(echo "$wf" | jq -r '.id')
            wf_name=$(echo "$wf" | jq -r '.name')
            echo "=== Processing: $wf_name (id=$wf_id) ==="

            # 获取该 workflow 所有运行记录，按创建时间倒序，跳过前 1 条
            runs_to_delete=$(gh api "repos/$REPO/actions/workflows/$wf_id/runs?per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[1:] | .[].id')

            count=$(echo "$runs_to_delete" | grep -c . || true)
            if [ "$count" -eq 0 ]; then
              echo "  ✅ 不超过1条，无需清理"
              continue
            fi

            echo "  🗑️  将删除 $count 条旧记录"
            echo "$runs_to_delete" | while read -r run_id; do
              gh api -X DELETE "repos/$REPO/actions/runs/$run_id" && echo "  ✅ 已删除 run $run_id" || echo "  ❌ 删除 run $run_id 失败"
            done
          done

          echo "🎉 全部清理完成"

      - name: Delete old caches, keep latest 1 per key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          tmp=$(mktemp)
          page=1
          # 分页拉全量缓存（每页最多 100 条）
          while :; do
            resp=$(gh api "repos/$REPO/actions/caches?per_page=100&page=$page")
            cnt=$(echo "$resp" | jq -r '.actions_caches | length')
            total=$(echo "$resp" | jq -r '.total_count // 0')
            echo "$resp" | jq -c '.actions_caches[] | {id, key, last_accessed_at, created_at}' >> "$tmp"

            if [ "$cnt" -eq 0 ]; then break; fi
            if [ $((page * 100)) -ge "$total" ]; then break; fi
            page=$((page + 1))
          done

          echo "发现缓存条目: $(jq -s 'length' "$tmp") 条"

          # 按 key 分组，每组按最近使用时间倒序，跳过最新 1 条
          to_delete=$(jq -s -r '
            group_by(.key)[]
            | sort_by(.last_accessed_at // .created_at // "")
            | reverse
            | .[1:][]
            | [ (.id|tostring), .key ] | @tsv
          ' "$tmp")

          if [ -z "$to_delete" ]; then
            echo "  ✅ 每个 key 都不超过1条，无需清理"
          else
            echo "$to_delete" | while IFS=$'\t' read -r cache_id cache_key; do
              if gh api -X DELETE "repos/$REPO/actions/caches/$cache_id" >/dev/null 2>&1; then
                echo "  ✅ 已删除 cache $cache_id ($cache_key)"
              else
                echo "  ❌ 删除 cache $cache_id ($cache_key) 失败（可能正被运行中的 job 占用）"
              fi
              sleep 0.3   # 轻微限速，避免触发 API 二级速率限制
            done
          fi

          rm -f "$tmp"
          echo "🎉 缓存清理完成"
